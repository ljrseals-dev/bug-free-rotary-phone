# Design 1 — Demographic-Aware Inner-Voice Synthesis
# Reference config. Values are starting points, not tuned results.

run:
  name: d1_daca_vits_evo
  seed: 1337
  output_dir: outputs/d1

base_model:
  name: "ZDisket/VITS-evo"
  revision: "PIN_COMMIT_SHA"        # pin before training
  format: onnx
  freeze_base: true

data:
  corpora:
    - name: common_voice
      license: CC0
      split: train
    - name: vctk
      license: CC-BY-4.0
      split: train
    - name: libritts_r
      license: CC-BY-4.0
      split: dev-clean
  sample_rate: 22050
  min_speakers_per_cell: 30
  age_bands: ["18-34", "35-59"]
  height_proxy: true

daca:
  enabled: true
  input_dims:
    age: 8
    gender: 4
    dialect: 16
    vtl: 1
  hidden_dim: 256
  layers: 2
  film: true
  trainable_params_target: 2_000_000

bone_conduction:
  enabled: true
  shelf_cutoff_hz: 350       # learned, initialized here
  shelf_gain_db: 6.0         # learned, initialized here
  harmonic_mix: 0.15         # learned, initialized here
  apply_stage: pre_vocoder
  differentiable: true

training:
  epochs: 50
  batch_size: 16
  lr: 1.0e-4
  optimizer: adamw
  loss:
    mel: 1.0
    speaker_embed: 0.5
    filter_reg: 0.01
  eval_every: 5

evaluation:
  conditions: [C0_baseline, C1_daca_only, C2_full_model, C3_recorded_anchor]
  n_participants: 35
  headphones_only_primary: true
  scales:
    ssr: 7
    mos: 5
    bcn: 5
  stimulus_list: evaluation/stimuli/harvard_12.txt
  analysis: mixed_effects
  correction: bonferroni
